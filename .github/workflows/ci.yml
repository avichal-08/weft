name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t weft-sandbox:dev infra/sandbox
      - run: sh infra/sandbox/smoke.sh weft-sandbox:dev
      - run: pnpm --filter @weft/sandbox test:integration
      - run: pnpm --filter @weft/agent test:integration
      - run: pnpm --filter @weft/worker test:integration
      - run: docker compose -f infra/compose.yml up -d --wait
      - run: docker compose -f infra/compose.yml exec -T redis redis-cli config get maxmemory-policy | grep -q noeviction
      - run: pnpm --filter @weft/queue test:integration

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: weft-web
            context: .
            file: apps/web/Dockerfile
          - name: weft-api
            context: .
            file: apps/api/Dockerfile
          - name: weft-worker
            context: .
            file: apps/worker/Dockerfile
          - name: weft-sandbox
            context: infra/sandbox
            file: infra/sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
